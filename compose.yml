services:

  wordpress:
    # Build a pushable image for ECS/Fargate; set WORDPRESS_IMAGE to an ECR URI when publishing.
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    image: "${WORDPRESS_IMAGE:-wordpress-fargate:php8.4-apache}"
    restart: always
    ports:
      - 80:80
    environment:
      WORDPRESS_DB_HOST: "${WORDPRESS_DB_HOST:-db}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER:-exampleuser}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD:-examplepass}"
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME:-exampledb}"
      WP_ENVIRONMENT_TYPE: "${WP_ENVIRONMENT_TYPE:-local}"
      
    volumes:
      # Developer mounts: edit only WordPress content, not the WordPress core root.
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

  db:
    # This containerized DB can be deployed to Fargate for short-lived testing; use compose.fargate-test.yml to remove the local volume.
    # WordPress supports MySQL 8.0+ / MariaDB 10.5+; use MySQL 8.4 LTS rather than the non-LTS latest tag.
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-exampledb}"
      MYSQL_USER: "${MYSQL_USER:-exampleuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-examplepass}"
      MYSQL_RANDOM_ROOT_PASSWORD: "${MYSQL_RANDOM_ROOT_PASSWORD:-1}"
    volumes:
      - db:/var/lib/mysql

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - 8080:8080
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      WP_API_USER: "${WP_API_USER:-api}"
      WP_API_APP_PASSWORD: "${WP_API_APP_PASSWORD}"
    volumes:
      # Developer mounts: edit only WordPress content, not the WordPress core root.
      - ./frontend:/app
      - /app/node_modules

volumes:
  db:
