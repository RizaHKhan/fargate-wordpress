; Environment-agnostic PHP settings for the WordPress Fargate image.
expose_php = Off

; Basic OPcache tuning for WordPress workloads.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Sensible upload defaults; override in the task definition if needed.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
